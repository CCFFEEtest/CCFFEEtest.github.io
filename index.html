<section aria-labelledby="logs-title">
  <h2 id="logs-title">Logs</h2>
  <ul id="logs-list" aria-live="polite"></ul>
  <p id="logs-status" role="status"></p>
</section>

<script>
  const logsList = document.getElementById('logs-list');
  const logsStatus = document.getElementById('logs-status');

  function formatDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat('fr-FR', {
      dateStyle: 'short',
      timeStyle: 'medium',
      timeZone: 'Europe/Paris'
    }).format(date);
  }

  async function loadLogs() {
    try {
      const response = await fetch(`logs.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const logs = await response.json();
      if (!Array.isArray(logs)) throw new Error('Format de logs invalide');

      logs.sort((a, b) => new Date(b.date) - new Date(a.date));
      logsList.replaceChildren();

      for (const log of logs) {
        const item = document.createElement('li');
        const time = document.createElement('time');
        time.dateTime = log.date;
        time.textContent = formatDate(log.date);
        item.append(time, document.createTextNode(` — ${log.message}`));
        logsList.append(item);
      }
      logsStatus.textContent = '';
    } catch (error) {
      logsStatus.textContent = 'Impossible de charger les logs pour le moment.';
      console.error('Erreur de chargement des logs :', error);
    }
  }

  loadLogs();
  window.setInterval(loadLogs, 10_000);
</script>
